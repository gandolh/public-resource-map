<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CivicMap categories sheet, proposed (dark twin)</title>
<meta name="description" content="A plain-HTML twin of the board comp, for the local Floor checks.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;display=swap">
<style>
/* Hallmark · shape: app screen · genre: civic map utility · theme: brand · redesign: full */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 · weakest: V, the blue, the category hues and the docked band carry the look, so the map is drawn quiet */
/* Hallmark · waive 24b · gaps and padding of 6, 10 and 14 px are half steps between the 4px tokens · 14 px side padding centres a 20 px icon and a label in 40 and 44 px controls, 6 px is the icon-to-label gap in chips, tabs and facts */
/* Hallmark · waive 72 · aside.panel is a scroll container, so its last event is cut by the box edge, not crowded against it · the column scrolls under its head */
/* Hallmark · answered F1 · What's on keeps the app's own straight apostrophe, the string as it ships · answered F24 · the place column keeps a 1px edge and a shadow: the shadow lifts it in light, the edge holds it in dark where a shadow is invisible */
/* Hallmark · answered F4 · one filled accent button per screen state: Directions on the place, the chosen chip and lens segment mark selection; every other button is outlined */
body{margin:0}
html,body{overflow-x:clip}
[data-theme="light"]{--color-bg:#e8ecf1;--color-surface:#fcfdfe;--color-surface-2:#f0f3f7;--color-surface-3:#e1e6ed;--color-line:#d8dee6;--color-line-strong:#c3cad5;--color-outline:#7f8896;--color-fg:#131922;--color-fg-muted:#545e6b;--color-fg-faint:#5f6977;--color-fg-on-accent:#fbfcff;--color-accent:#2a5bef;--color-accent-hover:#1f4bd8;--color-accent-weak:#e9effe;--color-accent-line:#c3d2fb;--color-danger:#c62f2f;--color-danger-weak:#fdeced;--color-ok:#0b7d55;--color-map-land:#eef0f2;--color-map-block:#e5e8ec;--color-map-road:#fbfcfd;--color-map-park:#dcebdc;--color-map-trail:#fbfcfd;--color-map-water:#cfe0ee;--color-map-label:#56606c;--color-pin-ico:#fbfcff;--color-pin-stroke:#fbfcff;--color-cat-park:#157f4a;--color-cat-library:#9c5c00;--color-cat-clinic:#c4342a;--color-cat-museum:#6d3fb0;--color-cat-townhall:#0f6e8e;--color-cat-community_center:#b03a86;--color-cat-education:#3a37a8;--color-cat-theater:#c2410c;--color-cat-sports:#4d7c0f;--color-cat-cultural_center:#0f766e;--color-cat-other:#566072;--shadow-e1:0 1px 2px rgba(19,25,34,.08), 0 2px 6px rgba(19,25,34,.06);--shadow-e2:0 1px 2px rgba(19,25,34,.08), 0 4px 14px rgba(19,25,34,.10);--shadow-e3:0 2px 4px rgba(19,25,34,.08), 0 12px 32px rgba(19,25,34,.16);--head-mix:7%}
[data-theme="dark"]{--color-bg:#090b0f;--color-surface:#1c212b;--color-surface-2:#252b36;--color-surface-3:#2e3541;--color-line:#2f3642;--color-line-strong:#3f4856;--color-outline:#7a8596;--color-fg:#edf0f4;--color-fg-muted:#a1aab7;--color-fg-faint:#8e98a6;--color-fg-on-accent:#0c0f14;--color-accent:#6d9bff;--color-accent-hover:#85adff;--color-accent-weak:#1d2b4d;--color-accent-line:#2f4474;--color-danger:#fb7185;--color-danger-weak:#2c1218;--color-ok:#34d399;--color-map-land:#15181d;--color-map-block:#1a1e24;--color-map-road:#262b33;--color-map-park:#17251d;--color-map-trail:#2a3a30;--color-map-water:#13202d;--color-map-label:#8e98a6;--color-pin-ico:#0c0f14;--color-pin-stroke:#0c0f14;--color-cat-park:#34c77b;--color-cat-library:#e3a223;--color-cat-clinic:#f2695f;--color-cat-museum:#b083f0;--color-cat-townhall:#35b0d8;--color-cat-community_center:#ee72bd;--color-cat-education:#8b88f5;--color-cat-theater:#f0863f;--color-cat-sports:#9bcc3c;--color-cat-cultural_center:#2bbfad;--color-cat-other:#93a0b4;--shadow-e1:0 1px 2px rgba(2,4,8,.5), 0 2px 6px rgba(2,4,8,.35);--shadow-e2:0 1px 2px rgba(2,4,8,.5), 0 4px 14px rgba(2,4,8,.45);--shadow-e3:0 2px 4px rgba(2,4,8,.5), 0 12px 32px rgba(2,4,8,.6);--head-mix:12%}
.pg{container:page/inline-size;background:var(--color-bg);color:var(--color-fg);font:400 14px/20px Archivo,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.pg *{box-sizing:border-box}
.pg button,.pg input,.pg a{font:inherit;color:inherit}
.pg button{cursor:pointer}
.pg a{text-decoration:none}
.pg{caret-color:var(--color-accent)}
.pg ::selection{background:var(--color-accent-line);color:var(--color-fg)}
.pg h1,.pg h2{text-wrap:balance}
.pg .btn:active,.pg .chip:active,.pg .lens button:active,.pg .close:active,.pg .bell:active,.pg .ctrls button:active,.pg .ibtn:active,.pg .draw:active{background:var(--color-surface-3);color:var(--color-fg)}
.pg .btn.primary:active{background:var(--color-accent-hover);color:var(--color-fg-on-accent)}
.pg .chip.on:active,.pg .lens button[aria-pressed=true]:active{background:var(--color-accent-hover);color:var(--color-fg-on-accent)}
.pg button:disabled{background:var(--color-surface-2);color:var(--color-fg-faint);border-color:var(--color-line-strong);cursor:not-allowed}
.pg .ic{flex:none}
.pg .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{position:relative;display:flex;flex-direction:column;height:800px;min-height:800px;overflow:hidden;background:var(--color-bg)}
.app.wo{height:auto;overflow:visible}
.island{background:var(--color-surface);border:1px solid var(--color-line-strong);border-radius:12px;box-shadow:var(--shadow-e2)}
.top{height:52px;flex:none;background:var(--color-surface);border-bottom:1px solid var(--color-line);display:flex;align-items:center;gap:8px;padding:0 16px;position:relative;z-index:6}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;line-height:24px;letter-spacing:-.01em;margin-right:8px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--color-accent);color:var(--color-fg-on-accent);display:grid;place-items:center}
.city{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--color-line-strong);border-radius:8px;background:var(--color-surface);font-weight:500;white-space:nowrap}
.city .ic{color:var(--color-fg-muted)}
.nav{display:flex;height:52px;margin-left:8px}
.nav a{white-space:nowrap;position:relative;display:flex;align-items:center;padding:0 12px;color:var(--color-fg-muted);font-weight:500}
.nav a:hover{color:var(--color-fg)}
.nav a[aria-current=page]{color:var(--color-fg)}
.nav a[aria-current=page]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--color-accent);border-radius:2px}
.right{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:flex;padding:2px;border:1px solid var(--color-line-strong);border-radius:8px;background:var(--color-surface-2);gap:2px}
.seg button{height:30px;min-width:36px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--color-fg-muted);font-weight:600;font-size:12px;line-height:16px}
.seg button[aria-pressed=true]{background:var(--color-accent);color:var(--color-fg-on-accent)}
.ibtn{width:36px;height:36px;border:1px solid transparent;border-radius:8px;background:transparent;display:grid;place-items:center;color:var(--color-fg-muted)}
.ibtn:hover{background:var(--color-surface-2);color:var(--color-fg)}
.ibtn.acct{background:var(--color-surface-2);border-color:var(--color-line)}
.band{flex:none;color:var(--color-fg);background:var(--color-surface);border-bottom:1px solid var(--color-line);box-shadow:var(--shadow-e1);padding:8px 16px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:5}
.r1{display:flex;align-items:center;gap:16px;height:40px}
.r2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.search{display:flex;align-items:center;gap:8px;height:40px;width:360px;flex:none;padding:0 12px;border:1px solid var(--color-outline);border-radius:8px;background:var(--color-surface);position:relative}
.search .ic{color:var(--color-fg-muted)}
.search input{flex:1;min-width:0;height:38px;border:0;background:transparent;outline:0;font-size:14px;line-height:20px}
.search input::placeholder{color:var(--color-fg-faint);opacity:1}
.search:focus-within{outline:2px solid var(--color-accent);outline-offset:2px}
.hint,.cats,.cnt2,.r1 .t1,.r2 .lensc{display:none}
.lens{display:flex;gap:2px;padding:3px;border:1px solid var(--color-line-strong);border-radius:10px;background:var(--color-surface-2);flex:none}
.lens button{height:32px;padding:0 14px;border:0;border-radius:7px;background:transparent;font-weight:500;color:var(--color-fg-muted)}
.lens button:hover{color:var(--color-fg);background:var(--color-surface-3)}
.lens button[aria-pressed=true]{background:var(--color-accent);color:var(--color-fg-on-accent);box-shadow:var(--shadow-e1)}
.lens.p{display:none}
.lens.p.on{display:flex}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--color-line-strong);border-radius:999px;background:var(--color-surface);font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;flex:none}
.chip:hover{background:var(--color-surface-2)}
.chip.on{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-fg-on-accent)}
.tools{margin-left:auto;display:flex;align-items:center;gap:16px;flex:none}
.wob{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 16px}
.srcl{align-items:center;justify-content:space-between}
.srcl .tix{margin:0 0 0 auto}
.count{display:flex;align-items:center;gap:16px;font-size:12px;line-height:16px;color:var(--color-fg-muted);white-space:nowrap}
.count b{font-weight:600;color:var(--color-fg)}
.count .cev{display:inline-flex;align-items:center;gap:6px}
.count .cev .ic{color:var(--color-accent)}
.draw{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--color-outline);border-radius:8px;background:var(--color-surface);font-weight:500;white-space:nowrap}
.draw:hover{background:var(--color-surface-2)}
.draw .ic{color:var(--color-fg-muted)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--color-bg)}
.field{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;background:var(--color-map-land);--cy:50%}
.place .field{left:calc(var(--col) + 24px);border-left:1px solid var(--color-line-strong)}
.place{--col:400px}
.map{position:absolute;inset:0;overflow:hidden}
.mapsvg{position:absolute;left:calc(50% - 855px);top:calc(var(--cy) - 448px);display:block;max-width:none}
.mapsvg .land{fill:var(--color-map-land)}
.mapsvg .blk rect{fill:var(--color-map-block)}
.mapsvg .carve polyline,.mapsvg .road polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mapsvg .carve polyline{stroke:var(--color-map-land)}
.mapsvg .road polyline{stroke:var(--color-map-road)}
.mapsvg .park{fill:var(--color-map-park);stroke:var(--color-map-land)}
.mapsvg .trail{fill:none;stroke:var(--color-map-trail);stroke-width:3;stroke-linecap:round;opacity:.8}
.mapsvg .water{fill:var(--color-map-water)}
.mapsvg .plaza{fill:var(--color-map-road);stroke:var(--color-map-land);stroke-width:3}
.mapsvg .pal{fill:var(--color-map-block);stroke:var(--color-map-label);stroke-opacity:.35;stroke-width:1}
.mapsvg .lbl text{font:500 12px/16px Archivo,system-ui,sans-serif;fill:var(--color-map-label);letter-spacing:.01em}
.mapsvg .lbl .pk{font-size:13px}
.mapsvg .lbl text.halo{fill:none;stroke:var(--color-map-land);stroke-width:4;stroke-linejoin:round}
.mapsvg .lbl text.hp{stroke:var(--color-map-park)}
.mapsvg .dim{opacity:.5}
.mapsvg .pf{fill:var(--h);stroke:var(--color-pin-stroke);stroke-width:1.5}
.mapsvg .pf.sel{stroke-width:inherit}
.mapsvg .ring{fill:none;stroke:var(--color-accent);stroke-linejoin:round}
.mapsvg .pchip{fill:var(--color-surface);stroke:var(--color-line-strong)}
.mapsvg .chipt{font:600 12px Archivo,system-ui,sans-serif;fill:var(--color-fg)}
.mapsvg .pchip.sc{fill:var(--color-accent);stroke:var(--color-surface);stroke-width:2}
.mapsvg .chipt.sc{fill:var(--color-fg-on-accent)}
.ctrls{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.ctrls .grp{display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.ctrls button{width:40px;height:40px;border:0;background:transparent;display:grid;place-items:center;color:var(--color-fg)}
.ctrls button:hover{background:var(--color-surface-2)}
.ctrls .grp button+button{border-top:1px solid var(--color-line)}
.ctrls .one{width:40px;height:40px;border-radius:12px;overflow:hidden}
.attrib{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;height:32px;border-radius:999px;box-shadow:var(--shadow-e1);font-size:12px;line-height:16px;color:var(--color-fg-muted);z-index:3;overflow:hidden}
.attrib a{padding:0 12px;color:var(--color-fg);font-weight:500;display:flex;align-items:center;height:100%}
.attrib a:hover{text-decoration:underline}
.attrib span{padding:0 12px;border-left:1px solid var(--color-line);height:100%;display:flex;align-items:center}
.srcbtn,.tabs,.evpill,.grab{display:none}
.evpill{position:absolute;left:12px;top:12px;height:32px;align-items:center;gap:8px;padding:0 12px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;z-index:3}
.panel{position:absolute;left:12px;top:12px;bottom:12px;width:var(--col);color:var(--color-fg);background:var(--color-surface);border:1px solid var(--color-line-strong);border-radius:12px;box-shadow:var(--shadow-e3);display:flex;flex-direction:column;overflow:hidden;z-index:4;--hue:var(--color-cat-museum)}
.head{flex:none;padding:12px 16px 16px;background:color-mix(in srgb,var(--hue) var(--head-mix),var(--color-surface));border-bottom:1px solid var(--color-line-strong);position:relative}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;min-height:36px}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--hue) 40%,var(--color-surface));background:var(--color-surface);font-size:12px;line-height:16px;font-weight:600;color:var(--color-fg)}
.badge .ic{color:var(--hue)}
.close{width:36px;height:36px;border:1px solid var(--color-line-strong);border-radius:8px;background:var(--color-surface);display:grid;place-items:center;color:var(--color-fg-muted);margin-right:-4px}
.close:hover{color:var(--color-fg);background:var(--color-surface-2)}
.title{margin:0;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.addr{margin:4px 0 0;font-size:13px;line-height:18px;color:var(--color-fg-muted)}
.actions{display:flex;gap:8px;margin-top:16px}
.btn{height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid var(--color-outline);border-radius:8px;background:var(--color-surface);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--color-surface-2)}
.btn.primary{flex:1;background:var(--color-accent);border-color:var(--color-accent);color:var(--color-fg-on-accent);font-weight:600}
.btn.primary:hover{background:var(--color-accent-hover);border-color:var(--color-accent-hover)}
.btn.icon{width:40px;padding:0;flex:none}
.body{flex:1;overflow:auto;background:var(--color-surface)}
.facts{margin:0;padding:4px 0}
.fact{display:grid;grid-template-columns:76px minmax(0,1fr);gap:0 8px;margin:0 16px;padding:10px 0;border-bottom:1px solid var(--color-line)}
.fact:last-child{border-bottom:0}
.fact dt{display:flex;align-items:flex-start;gap:6px;font-size:13px;line-height:20px;color:var(--color-fg-faint);font-weight:500}
.fact dt .ic{color:var(--color-fg-muted);margin-top:2px}
.fact dd{margin:0;font-size:14px;line-height:20px}
.fact dd a{color:var(--color-accent)}
.fact dd a:hover{text-decoration:underline}
.src{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.src>span:first-child{font-size:12px;line-height:20px}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12px;line-height:20px;color:var(--color-fg-muted)}
.events{padding:12px 16px 20px;border-top:1px solid var(--color-line-strong);background:var(--color-surface)}
.evh{display:flex;align-items:baseline;justify-content:space-between}
.evh h2{margin:0;font-size:14px;line-height:20px;font-weight:600}
.evh span{font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.grp-t{margin:12px 0 4px;font-size:12px;line-height:16px;font-weight:500;color:var(--color-fg-faint)}
.evs,.wl{list-style:none;margin:0;padding:0}
.ev,.wr{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--color-line)}
.ev:first-child,.wr:first-child{border-top:0}
.tile{flex:none;width:44px;height:52px;border-radius:8px;background:var(--color-surface-2);border:1px solid var(--color-line-strong);display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile .dy{font-size:16px;line-height:22px;font-weight:600;color:var(--color-fg)}
.tile .mo{font-size:12px;line-height:14px;color:var(--color-fg-muted)}
.evb{flex:1;min-width:0}
.et{margin:0;font-weight:600;font-size:14px;line-height:20px}
.meta{margin:2px 0 0;display:flex;flex-wrap:wrap;gap:0 12px;font-size:13px;line-height:18px;color:var(--color-fg-muted)}
.meta .when{color:var(--color-fg);font-weight:500}
.meta .cat,.meta .plc{display:inline-flex;align-items:center;gap:6px}
.tix{display:inline-flex;align-items:center;gap:4px;margin-top:6px;color:var(--color-accent);font-weight:500;min-height:24px}
.tix:hover{text-decoration:underline}
.bell{flex:none;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--color-fg-muted);display:grid;place-items:center;margin-right:-6px}
.bell:hover{background:var(--color-surface-2);color:var(--color-fg)}
.wom{width:100%;max-width:880px;margin:0 auto;padding:28px 16px 40px}
.woh{margin-bottom:16px}
.pt{margin:0;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.015em}
.sub{margin:4px 0 0;font-size:14px;line-height:20px;color:var(--color-fg-muted)}
.wolist{background:var(--color-surface);border:1px solid var(--color-line-strong);border-radius:12px;box-shadow:var(--shadow-e2);overflow:hidden}
.gh{display:flex;align-items:baseline;justify-content:space-between;padding:8px 16px;background:var(--color-surface-2);border-top:1px solid var(--color-line-strong);border-bottom:1px solid var(--color-line-strong)}
.grp:first-child .gh{border-top:0}
.gh h2{margin:0;font-size:13px;line-height:18px;font-weight:600;color:var(--color-fg)}
.gh span{font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.wl{padding:0 16px}
.wr .bell{margin-right:-6px}
.wr .plc{color:var(--color-fg-muted)}
@container page (max-width:899px){
.app{height:844px;min-height:844px}
.app.wo{height:auto}
.top{height:52px;padding:0 12px;gap:6px}
.bname,.nav{display:none}
.brand{margin-right:0;width:44px;height:44px;justify-content:center;flex:none}
.city{height:44px;padding:0 10px;gap:6px}
.seg{padding:1px}
.seg button{height:44px;min-width:44px}
.ibtn{width:44px;height:44px}
.band{padding:8px 0;gap:8px}
.r1{padding:0 12px;height:44px;gap:8px}
.r1 .lens.d,.r1 .t1,.r2 .t2,.tools{display:none}
.search{flex:1;min-width:0;width:auto;height:44px;padding:0 12px;border-radius:12px}
.search input{font-size:16px;line-height:24px;height:42px}
.hint{display:block;font-size:12px;line-height:16px;color:var(--color-fg-muted);white-space:nowrap}
.cats{display:inline-flex;align-items:center;gap:6px;flex:none;height:44px;padding:0 12px;border:1px solid var(--color-outline);border-radius:12px;background:var(--color-surface);font-size:13px;line-height:18px;font-weight:500;white-space:nowrap}
.cats .ic{color:var(--color-fg-muted)}
.cats .nb{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--color-accent);color:var(--color-fg-on-accent);font-size:12px;line-height:20px;font-weight:600;text-align:center}
.r2{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:0 28px 0 12px;gap:8px;-webkit-mask-image:linear-gradient(90deg,var(--color-fg) calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,var(--color-fg) calc(100% - 28px),transparent)}

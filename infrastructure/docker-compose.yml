# public-resource-map. Build context is the repo root (..).
services:
  prm-api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: prod
    image: prm-api:1.0
    ports:
      # LOOPBACK ONLY — Caddy is the only way in.
      - "127.0.0.1:${PORT:-8790}:${PORT:-8790}"
    env_file:
      - .env
    volumes:
      - ${PRM_DATA_DIR:-../backend/data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'wget -qO- "http://127.0.0.1:${PORT:-8790}/health"']
      interval: 30s
      timeout: 3s
      start_period: 10s

  # Migrations only. The compiled migrator ships in the API image, so this
  # builds the same `prod` stage as `prm-api`: both tags name one image and the
  # migration costs no extra disk. Only `npm run db:migrate` needs tsx, and that
  # stays a development command.
  #
  # `profiles` keeps it out of `compose up`: it is invoked explicitly by the
  # deploy with `compose run --rm prm-migrate`, never started as a service.
  prm-migrate:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: prod
    image: prm-migrate:1.0
    env_file:
      - .env
    volumes:
      - ${PRM_DATA_DIR:-../backend/data}:/data
    entrypoint: ["node", "backend/dist/db/migrate.js"]
